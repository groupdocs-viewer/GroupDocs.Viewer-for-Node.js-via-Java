name: Run Examples

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Examples/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Examples/**'
  workflow_dispatch:

jobs:
  run-examples:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t groupdocs-viewer-examples -f Examples/Dockerfile Examples/

      - name: Run examples
        run: |
          docker run --rm groupdocs-viewer-examples
